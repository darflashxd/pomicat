name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/eval/test_score.py
      - run: python tools/eval/test_model_comparison.py
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/eval/credential_browser.py
      - run: python -m playwright install --with-deps firefox
      - run: python tools/eval/credential_browser.py --browser firefox
      - run: python tools/eval/relay_browser.py
      - run: python tools/eval/relay_browser.py --browser firefox
  model-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/eval/chrome_ner.py
