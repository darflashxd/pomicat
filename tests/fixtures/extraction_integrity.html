<!doctype html><meta charset="utf-8"><title>Extraction integrity regression</title>
<pre id="result">Running</pre><iframe id="chat" src="fake_chat.html" style="width:100%;height:650px"></iframe>
<script>
document.getElementById('chat').onload=async()=>{
 const w=document.getElementById('chat').contentWindow,d=w.document;
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
 try{
  for(let i=0;i<100&&!d.getElementById('safeshare-action-pill');i++)await wait(20);
  const thread=d.getElementById('thread');
  thread.innerHTML='<div data-message-author-role="user"><div data-user-message-bubble="true">First question untouched</div></div>'+
   '<div data-message-author-role="assistant"><div class="markdown"><h2>Analysis heading</h2><p>First answer untouched</p><table><tr><th>Item</th><th>Result</th></tr><tr><td>Alpha</td><td>Beta</td></tr></table><pre><code>port = 8080</code></pre></div></div>'+
   '<div data-message-author-role="user">Second question untouched</div><div data-message-author-role="assistant"><p>Second answer untouched</p></div>';
  d.getElementById('prompt-textarea').innerText='DRAFT NEVER SHARE';
   w.confirm=message=>{if(message.includes('could not verify'))return true;throw Error('Extractor lost a role');};
   d.getElementById('safeshare-action-pill').click();for(let i=0;i<200&&!d.getElementById('diff-box-orig');i++)await wait(25);
  let orig=d.getElementById('diff-box-orig');assert(orig,'modal unavailable');
  const text=orig.innerText;
  const expected=['First question untouched','First answer untouched','Second question untouched','Second answer untouched'];
  let previous=-1;for(const value of expected){const index=text.indexOf(value);assert(index>previous,'turn missing/out of order: '+value);previous=index;}
  assert(!text.includes('DRAFT NEVER SHARE'),'composer leaked into share');
  for(const value of ['Analysis heading','Alpha','Beta','port = 8080'])assert(text.includes(value),'format content lost: '+value);
  assert(orig.querySelectorAll('.turn-block').length===4,'duplicate or missing turns');
  d.getElementById('safeshare-close-btn').click();
  thread.innerHTML='<div data-chatgpt-search-unit-key="user-one"><div data-user-message-bubble="true">Modern question</div></div>'+
    '<div data-chatgpt-search-unit-key="answer-one"><div data-markdown-text-style="assistant-message"><p>Answer part one</p></div><div data-markdown-text-style="assistant-message"><p>Answer part two</p></div></div>';
   d.getElementById('safeshare-action-pill').click();for(let i=0;i<200&&!d.getElementById('diff-box-orig');i++)await wait(25);
  orig=d.getElementById('diff-box-orig');
  assert(orig.querySelectorAll('.turn-block').length===2,'split modern answer not joined');
   assert(orig.innerText.includes('Answer part one')&&orig.innerText.includes('Answer part two'),'modern answer content lost');
   d.getElementById('safeshare-close-btn').click();
   thread.innerHTML='<div data-message-author-role="user">Question <span hidden>complete hidden tail</span><button aria-expanded="false">Show more</button></div><div data-message-author-role="assistant">Same answer</div><div data-message-author-role="assistant">Same answer</div>';
   const expand=thread.querySelector('button');expand.onclick=()=>{thread.querySelector('span').hidden=false;expand.setAttribute('aria-expanded','true');};
   w.confirm=()=>true;
   d.getElementById('safeshare-action-pill').click();for(let i=0;i<200&&!d.getElementById('diff-box-orig');i++)await wait(25);
   orig=d.getElementById('diff-box-orig');
   assert(orig.innerText.includes('complete hidden tail'),'collapsed tail missing');
   assert(!orig.innerText.includes('Show more'),'expand control leaked');
   assert(orig.querySelectorAll('.turn-block').length===3,'legitimate identical turns removed');
   d.getElementById('safeshare-close-btn').click();
   thread.innerHTML='<div data-message-id="shared-wrapper"><div data-message-author-role="user">Question <span hidden>slow complete tail</span><button>Show more</button></div><div data-message-author-role="assistant">Separate answer</div></div>';
   thread.querySelector('button').onclick=()=>setTimeout(()=>{thread.querySelector('span').hidden=false;thread.querySelector('button').remove();},1200);
   d.getElementById('safeshare-action-pill').click();for(let i=0;i<300&&!d.getElementById('diff-box-orig');i++)await wait(25);
   orig=d.getElementById('diff-box-orig');
   assert(orig.innerText.includes('slow complete tail'),'slow expand without aria-expanded lost');
   assert(orig.querySelectorAll('.turn-block').length===2,'shared wrapper merged roles');
   d.getElementById('safeshare-close-btn').click();
   thread.style.cssText='height:180px;overflow-y:auto';
   thread.innerHTML='<div style="height:900px;position:relative"><div id="windowed"></div></div>';
   const render=()=>{const n=Math.min(3,Math.floor(thread.scrollTop/180));d.getElementById('windowed').innerHTML=[n,n+1].map(i=>'<div style="position:absolute;top:'+i*180+'px" data-message-author-role="'+(i%2?'assistant':'user')+'">WINDOW_MESSAGE_'+i+'</div>').join('');};
   thread.addEventListener('scroll',render);render();
   d.getElementById('safeshare-action-pill').click();for(let i=0;i<700&&!d.getElementById('diff-box-orig');i++)await wait(25);
   orig=d.getElementById('diff-box-orig');
   assert(orig.querySelectorAll('.turn-block').length===5,'virtual messages without IDs lost or duplicated');
   for(let i=0;i<5;i++)assert(orig.innerText.includes('WINDOW_MESSAGE_'+i),'missing virtual turn '+i);
   assert(thread.scrollTop===0,'scroll position not restored');
   d.getElementById('safeshare-close-btn').click();
   thread.style.cssText='';
   thread.innerHTML='<div data-message-id="image-only" data-message-author-role="user"><button><img alt="PRIVATE_FILENAME.png" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></button></div><div data-message-id="image-answer" data-message-author-role="assistant">Image answer</div><div data-message-id="text-image" data-message-author-role="user">Please review.<div data-testid="attachment-card">PRIVATE_FILENAME.pdf<img alt="PRIVATE_DESCRIPTION" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></div></div><div data-message-id="avatar" data-message-author-role="assistant"><span class="avatar"><img alt="avatar"></span>Final answer</div>';
   d.getElementById('safeshare-action-pill').click();for(let i=0;i<300&&!d.getElementById('diff-box-orig');i++)await wait(25);
   orig=d.getElementById('diff-box-orig');
   assert(orig.querySelectorAll('.turn-block').length===4,'attachment-only user message lost');
   assert((orig.innerText.match(/\[Attachment omitted\]/g)||[]).length===2,'attachment markers missing or avatar counted');
   assert(!/PRIVATE_|data:image/.test(orig.innerText),'attachment metadata leaked');
   assert(orig.innerText.includes('Please review.'),'attachment caption lost');
   document.getElementById('result').textContent='PASS: extraction, slow/plain expand, virtual history, roles, attachments without metadata, formatting. No uploads.';
 }catch(e){document.getElementById('result').textContent='FAIL: '+e.message;}
};
</script>
