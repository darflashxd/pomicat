<!doctype html><meta charset="utf-8"><title>Submit lifecycle regression</title>
<pre id="result">Running</pre>
<iframe id="chat" src="fake_chat.html" style="width:100%;height:500px"></iframe>
<script>
document.getElementById('chat').onload = async () => {
  const w = document.getElementById('chat').contentWindow, d = w.document;
  const wait = ms => new Promise(r => setTimeout(r,ms));
  const assert = (ok,msg) => { if(!ok) throw Error(msg); };
  try {
    for(let i=0;i<100 && !d.getElementById('safeshare-shield-indicator');i++) await wait(20);
    assert(d.getElementById('safeshare-shield-indicator'),'initialization timed out');
    w.SafeShareSettings.set('shield_mode','all');
    let resolve, requests=0, sends=0;
    w.SafeShareNer = {analyze:() => {requests++;return new Promise(r=>resolve=r);}};
    d.getElementById('send').addEventListener('click',()=>sends++);
    const input=d.getElementById('prompt-textarea');
    const type=text=>{input.innerText=text;input.dispatchEvent(new w.Event('input',{bubbles:true}));};
    const finish=()=>resolve({success:true,state:'checked',spans:[]});
    type('My password is PrivateSecret42');
    d.getElementById('send').click();d.getElementById('send').click();
    assert(requests===1 && sends===0,'double click escaped asynchronous guard');
    type('New draft remains untouched');finish();await wait(250);
    assert(sends===0 && input.innerText==='New draft remains untouched','edited draft overwritten/sent');
    type('My password is AnotherSecret43');d.getElementById('send').click();
    w.history.pushState({},'', '?different-chat=1');finish();await wait(250);
    assert(sends===0 && input.innerText.includes('AnotherSecret43'),'navigation sent stale draft');
    type('My password is ModeSecret46');d.getElementById('send').click();
    w.SafeShareSettings.set('shield_mode','off');finish();await wait(200);
    assert(sends===0 && input.innerText.includes('ModeSecret46'),'mode switch replayed old draft');
    w.SafeShareSettings.set('shield_mode','all');
    type('My password is FinalSecret44');d.getElementById('send').click();finish();
    await wait(20);
    d.getElementById('send').click(); // During editor synchronization, before replay.
    await wait(200);
    assert(sends===1 && !w.__sent.includes('FinalSecret44'),'replay gap duplicate or secret leak');
    type('My password is NextSecret45');d.getElementById('send').click();finish();await wait(200);
    assert(sends===2 && !w.__sent.includes('NextSecret45'),'recent replay bypassed next draft');
    type('I earn $12,500 monthly.');d.getElementById('send').click();finish();await wait(200);
    assert(sends===3&&!w.__sent.includes('12,500')&&w.__sent.includes('<S'),'multiline financial replay failed or leaked');
    let submissions=0;
    const form=d.getElementById('f');
    form.addEventListener('submit',e=>{e.preventDefault();submissions++;w.__formSent=input.innerText;input.innerText='';});
    type('My password is FormSecret47');form.requestSubmit();
    assert(submissions===0,'form submit bypassed protection');finish();await wait(200);
    assert(submissions===1&&!w.__formSent.includes('FormSecret47'),'form replay failed or leaked');
    document.getElementById('result').textContent='PASS: rapid clicks, edited draft, navigation/mode changes, replay gap, next draft, native form submit. No uploads.';
  } catch(e) {document.getElementById('result').textContent='FAIL: '+e.message;}
};
</script>
