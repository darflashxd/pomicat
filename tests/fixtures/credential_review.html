<!doctype html><meta charset="utf-8"><title>Credential boundary browser check</title>
<pre id="result">Running</pre>
<iframe id="chat" src="fake_chat.html" style="width:100%;height:650px"></iframe>
<script>
document.getElementById('chat').onload = async () => {
  const w = document.getElementById('chat').contentWindow;
  const d = w.document;
  const assert = (ok, msg) => { if (!ok) throw Error(msg); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const lines = [
    'Password for my online banking is Tr0ub4dor&3',
    'Kode OTP BCA: 739204 berlaku 5 menit',
    'My IBAN is DE89 3704 0044 0532 0130 00',
    'AWS key saya AKIAJ3XQ7WMZ4PLK5HDV',
    'My coordinates are 37.7749, -122.4194',
    'Address: 123 Main Street, Springfield, IL 62704. Please recommend a coffee shop nearby.',
    'My OTP code is four eight two nine one six',
    'Kirim ke b u d i @ g m a i l . c o m',
    'My Aussie mobile is 0491 570 156',
    'NIK saya 317401 230495 0001',
    "JWT_SECRET='JWT_SECRET'"
  ];
  const secrets = ['Tr0ub4dor&3', '739204', '3704', 'AKIAJ3', '37.7749', '62704', 'four eight two nine one six', 'b u d i', '0491 570 156', '317401 230495'];
  try {
    const corpusResponse = await fetch('english_credentials.jsonl');
    assert(corpusResponse.ok, 'English corpus unavailable');
    const corpus = (await corpusResponse.text()).trim().split('\n').map(line=>JSON.parse(line));
    for (const row of corpus) {
      lines.push(row.source_text);
      secrets.push(...row.privacy_mask.map(span=>span.value));
    }
    for (let n=0; n<100 && !d.getElementById('safeshare-shield-indicator'); n++) await wait(20);
    assert(d.getElementById('safeshare-shield-indicator'), 'content script initialization timed out');
    w.SafeShareSettings.set('shield_mode', 'all');
    const input = d.getElementById('prompt-textarea');
    input.innerText = lines.join('\n');
    input.dispatchEvent(new w.Event('input', {bubbles:true}));
    d.getElementById('send').click();
    for (let n=0; n<100 && !w.__sent; n++) await wait(20);
    assert(w.__sent, 'send timed out');
    assert(secrets.every(s => !w.__sent.includes(s)), 'partial secret in outbound prompt');
    assert(w.__sent.includes('Please recommend a coffee shop nearby.'), 'address swallowed request');
    for (const row of corpus.filter(row=>!row.privacy_mask.length)) assert(w.__sent.includes(row.source_text), 'safe English control changed');
    d.getElementById('answer').textContent = 'Done.';
    d.getElementById('safeshare-action-pill').click();
    await wait(100);
    const preview = d.getElementById('diff-box-sanitized');
    assert(preview && secrets.every(s => !preview.textContent.includes(s)), 'secret in preview');
    assert(!preview.textContent.includes('[REDACTED_SECRET_'), 'own placeholder detected again: ' + preview.textContent);
    d.getElementById('safeshare-close-btn').click();
    for (const mode of ['off', 'amounts']) {
      w.SafeShareSettings.set('shield_mode', mode);
      const typed = 'PIN ATM saya 482916';
      input.innerText = typed;
      input.dispatchEvent(new w.Event('input', {bubbles:true}));
      w.__sent = null;
      d.getElementById('send').click();
      for (let n=0; n<100 && !w.__sent; n++) await wait(20);
      assert(w.__sent === typed, mode + ' must not rewrite credentials');
    }
    // Share Privately must also work on raw text when the optional shield was off.
    const modal = new (w.eval('SafeShareModal'))();
    modal.profile = 'public';
    modal.numbersMode = 'remove';
    modal.open([{role:'user', content:lines.concat(['I have asthma, depression and epilepsy.', 'Gaji saya lima belas juta rupiah per bulan.', 'My salary is 5000; identifier abc-5000-def; build_5000_alpha.']).join('\n')}, {role:'assistant',content:'Do not share credentials.'}]);
    const turnsFromDOM = () => [...d.querySelectorAll('#diff-box-sanitized .turn-block')].map(block => {
      const body = block.querySelector('.turn-body').cloneNode(true);
      body.querySelectorAll('.ss-badge-icon').forEach(el => el.remove());
      body.querySelectorAll('br').forEach(el => el.replaceWith('\n'));
      // Renderer adds one terminal line break per block, not part of the shared turn.
      return {role:block.querySelector('.turn-header').textContent.includes('USER') ? 'user' : 'assistant',content:body.textContent.replace(/\n$/, '')};
    });
    // Unknown formats must still be protectable without relying on model vocabulary.
    const unknown = 'ORBIT|violet phrase & 42|UNLISTED';
    modal.removeExisting();
    modal.open([{role:'user',content:lines.concat(['I have asthma, depression and epilepsy.', 'Gaji saya lima belas juta rupiah per bulan.', 'My salary is 5000; identifier abc-5000-def; build_5000_alpha.', 'Confidential note: '+unknown]).join('\n')}, {role:'assistant',content:'Do not share credentials.'}]);
    modal.addCustomSelection(unknown);
    const expected = turnsFromDOM();
    assert(JSON.stringify(expected) === JSON.stringify(modal.sanitizedTurns), 'raw share DOM/payload mismatch: ' + JSON.stringify({expected,actual:modal.sanitizedTurns}));
    assert(secrets.every(s => !expected[0].content.includes(s)), 'raw share missed a secret');
    assert(['asthma','depression','epilepsy','lima belas juta'].every(s=>!expected[0].content.includes(s)), 'contextual disclosure missed');
    assert(expected[0].content.includes('abc-5000-def') && expected[0].content.includes('build_5000_alpha'), 'financial substring replacement corrupted identifier');
    assert(!expected[0].content.includes(unknown) && expected[0].content.includes('[REDACTED_CUSTOM_'), 'unknown sensitive format not manually redacted');
    let encrypted, uploadCount = 0;
    const encrypt = modal.crypto.encrypt.bind(modal.crypto);
    modal.crypto.encrypt = async payload => {
      assert(JSON.stringify(payload.turns) === JSON.stringify(expected), 'publish changed reviewed turns');
      encrypted = await encrypt(payload);
      return encrypted;
    };
    w.fetch = () => { throw Error('Real network forbidden'); };
    w.browser = {storage:{local:{get:async()=>({})}},runtime:{sendMessage:async()=>{
      uploadCount++;
      return {success:true,data:{revoke_token:'fictional-test-token'}};
    }}};
    d.getElementById('btn-encrypt-publish').click();
    for (let n=0;n<100 && modal.publishing;n++) await wait(20);
    assert(encrypted && uploadCount === 1 && !modal.publishing, 'fake publication failed');
    const decoded = await modal.crypto.decrypt(encrypted.ciphertext, encrypted.key);
    assert(JSON.stringify(decoded.turns) === JSON.stringify(expected), 'decrypted payload differs from preview');
    modal.removeExisting();
    document.getElementById('result').textContent = 'PASS: production send modes, full masking, raw share, DOM/encrypted payload equality, placeholder stability. No real uploads.';
  } catch (e) { document.getElementById('result').textContent = 'FAIL: ' + e.message; }
};
</script>
