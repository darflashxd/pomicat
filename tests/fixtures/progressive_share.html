<!doctype html><meta charset="utf-8"><title>Progressive share hydration</title>
<link rel="stylesheet" href="../../extension/ui/modal.css">
<body style="background:#111;color:#eee;font-family:sans-serif;margin:0">
<pre id="result" style="position:fixed;top:0;left:0;z-index:5;background:#111;margin:0;padding:4px">Running…</pre>
<main>
  <div id="thread"></div>
</main>
<script src="../../extension/engine/span_arbiter.js"></script>
<script src="../../extension/engine/heuristics.js"></script>
<script src="../../extension/engine/maybe.js"></script>
<script src="../../extension/engine/transcript.js"></script>
<script src="../../extension/engine/contextual.js"></script>
<script src="../../extension/engine/pseudonymizer.js"></script>
<script src="../../extension/engine/policy.js"></script>
<script src="../../extension/engine/crypto.js"></script>
<script src="../../extension/engine/symbolic_vault.js"></script>
<script src="../../extension/engine/symbolic_rewriter.js"></script>
<script src="../../extension/engine/local_compute.js"></script>
<script src="../../extension/engine/settings.js"></script>
<script src="../../extension/ui/modal.js"></script>
<script>
// Mimics a long share link: the conversation arrives in batches every ~900ms while scrolling,
// never all at once. The scan must wait out the cadence instead of stopping at the first bottom.
const TOTAL = 6;
const thread = document.getElementById("thread");
let mounted = 0;
let pending = false;

function turn(index) {
  const unit = document.createElement("div");
  unit.setAttribute("data-turn-key", `turn-${index}`);
  unit.style.cssText = "display:block;height:560px;padding:12px;border-bottom:1px solid #333;overflow:hidden";
  const user = document.createElement("div");
  user.setAttribute("data-message-author-role", "user");
  user.innerHTML = `<div class="whitespace-pre-wrap">Question ${index}: how should this be shared?</div>`;
  const answer = document.createElement("div");
  answer.setAttribute("data-message-author-role", "assistant");
  answer.innerHTML = `<div class="markdown">Answer ${index}: keep the ${index}0,000 figure and the ${index}@example.test contact private.</div>`;
  unit.append(user, answer);
  return unit;
}

function mountNext() {
  if (mounted >= TOTAL) return;
  mounted += 1;
  thread.appendChild(turn(mounted));
}
mountNext();
mountNext();

function maybeGrow() {
  if (pending || mounted >= TOTAL) return;
  const scroller = document.scrollingElement;
  if (scroller.scrollTop + scroller.clientHeight < scroller.scrollHeight - 40) return;
  pending = true;
  setTimeout(() => { mountNext(); pending = false; }, 900);
}
document.addEventListener("scroll", maybeGrow, { passive: true });
setInterval(maybeGrow, 300);
</script>
<script src="../../extension/content_script.js"></script>
<script>
(async () => {
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (ok, message) => { if (!ok) throw new Error(message); };
  try {
    for (let i = 0; i < 100 && !document.getElementById("safeshare-action-pill"); i++) await wait(50);
    const pill = document.getElementById("safeshare-action-pill");
    assert(pill, "action pill missing");
    window.confirm = () => true;
    window.alert = (message) => { throw new Error("unexpected alert: " + message); };
    pill.click();
    for (let i = 0; i < 800 && !document.getElementById("safeshare-modal-backdrop"); i++) await wait(50);
    const backdrop = document.getElementById("safeshare-modal-backdrop");
    assert(backdrop, "review never opened");
    const turns = [...backdrop.querySelectorAll("#diff-box-orig .turn-block")].map((node) => node.textContent);
    // Every mounted batch must be in the review: 6 units x (question + answer).
    assert(mounted === TOTAL, `test page only mounted ${mounted} of ${TOTAL} batches`);
    assert(turns.length === TOTAL * 2, `expected ${TOTAL * 2} messages, got ${turns.length}`);
    assert(new Set(turns).size === turns.length, "duplicate messages in review");
    assert(turns.some((text) => text.includes("Question 6")), "last batch missing");
    document.getElementById("result").textContent =
      `PASS: waited for ${TOTAL} batches, captured ${turns.length} messages, no duplicates, one uninterrupted scan. No uploads.`;
  } catch (error) {
    document.getElementById("result").textContent = "FAIL: " + error.message;
  }
})();
</script>
