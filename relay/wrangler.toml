name = "safeshare-relay"
main = "worker.js"
compatibility_date = "2026-09-18"

[assets]
directory = "../viewer"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "safeshare-db"
database_id = "b16c35b1-8428-4ccd-b4bb-e4bdc4f51954"

# Per-IP limits so the relay can't be used as free file hosting or hammered.
# namespace_id is any number unique within the account.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

# Delete expired shares once a day (03:17 UTC)
[triggers]
crons = ["17 3 * * *"]
